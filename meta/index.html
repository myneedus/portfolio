<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codebase Stats</title>
  <link rel="stylesheet" href="../style.css">
  <script src="../global.js" type="module"></script>
  <script src="main.js?v=step3" type="module"></script>
</head>
<body>
  <h1>Codebase Stats</h1>
  <p>Summary statistics about the code in this portfolio.</p>
  <div id="stats"></div>
  <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd><a id="commit-link" href="" target="_blank" rel="noopener noreferrer"></a></dd>
    <dt>Date</dt>
    <dd id="commit-date"></dd>
    <dt>Time</dt>
    <dd id="commit-tooltip-time"></dd>
    <dt>Author</dt>
    <dd id="commit-author"></dd>
    <dt>Lines edited</dt>
    <dd id="commit-lines"></dd>
  </dl>
  <div id="scrolly-1">
    <div id="scatter-story"></div>
    <div id="scatter-plot">
      <h2>Commits by time of day</h2>
      <label>
        Show commits until:
        <input type="range" id="commit-progress" min="0" max="100" value="100">
        <time id="commit-time"></time>
      </label>
      <p id="selection-count" aria-live="polite">No commits selected</p>
      <div id="chart"></div>
    </div>
  </div>
  <h2>Selected commit languages</h2>
  <dl id="language-breakdown" class="stats"></dl>
  <dl id="files"></dl>
</body>
</html>
